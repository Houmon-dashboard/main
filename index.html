<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>訪問歯科 進捗ダッシュボード（テスト版）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="メニュー"></aside>
    <div id="backdrop" class="backdrop"></div>
    <div class="main">
      <header class="topbar no-print">
        <button id="menu-btn" class="menu-btn" type="button" aria-label="メニューを開く">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="page-title">ダッシュボード</h1>
        <div class="topbar-controls">
          <label class="mini-select"><span>訪問先</span><select id="place-filter"></select></label>
          <label class="mini-select"><span>入力者</span><select id="current-user"></select></label>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <div id="toast" class="toast no-print" hidden></div>
  <!-- 健診結果のお知らせのPDFダウンロード用（ブラウザ内で処理し、外部には送信しない） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" defer></script>
  <script src="app.js"></script>
</body>
</html>
